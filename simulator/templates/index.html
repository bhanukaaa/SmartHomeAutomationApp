<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Smart Home Monitor</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}" />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Smart Home Automation</h1>
                <div class="badge-count">
                    <span id="room-count">0</span> Rooms
                </div>
            </header>

            <div class="floors-container" id="floorsContainer"></div>
        </div>

        <script>
            const socket = io();

            const DeviceState = {
                ON: {name: "ON", class: "status-on"},
                OFF: {name: "OFF", class: "status-off"},
                ERROR: {name: "ERROR", class: "status-error"},
                DISCONNECTED: {
                    name: "DISCONNECTED",
                    class: "status-disconnected",
                },
            };

            let rooms = [];

            socket.on("initial_rooms", function (initialRooms) {
                rooms = initialRooms;
                renderAll();
            });

            socket.on("room_added", function (room) {
                if (!rooms.some((r) => r.roomID === room.roomID)) {
                    rooms.push(room);
                    renderAll();
                }
            });

            socket.on("device_added", function (payload) {
                const targetRoom = rooms.find(
                    (r) => r.roomID === payload.roomID,
                );
                if (targetRoom) {
                    if (
                        !findDeviceRecursive(
                            targetRoom.devices,
                            payload.device.deviceID,
                        )
                    ) {
                        targetRoom.devices.push(payload.device);
                        renderAll();
                    }
                }
            });

            socket.on("device_updated", function (device) {
                for (let r of rooms) {
                    const targetDevice = findDeviceRecursive(
                        r.devices,
                        device.deviceID,
                    );
                    if (targetDevice) {
                        targetDevice.state = device.state;
                        renderAll();
                        break;
                    }
                }
            });

            function findDeviceRecursive(deviceList, deviceID) {
                for (let d of deviceList) {
                    if (d.deviceID === deviceID) return d;
                    if (d.subUnits) {
                        let found = findDeviceRecursive(d.subUnits, deviceID);
                        if (found) return found;
                    }
                }
                return null;
            }

            function getStateInfo(state) {
                if (typeof state === "number") {
                    const numMap = {
                        1: "ON",
                        2: "OFF",
                        3: "ERROR",
                        4: "DISCONNECTED",
                    };
                    state = numMap[state] || "OFF";
                }
                return DeviceState[state] || DeviceState["OFF"];
            }

            function renderAll() {
                const container = document.getElementById("floorsContainer");
                container.innerHTML = "";

                const floors = [
                    ...new Set(rooms.map((r) => r.floorName || "G")),
                ];
                document.getElementById("room-count").innerText = rooms.length;

                floors.forEach((floorName) => {
                    const floorSection = document.createElement("div");
                    floorSection.className = "floor-section";

                    const floorTitle = document.createElement("h2");
                    floorTitle.innerText = `Floor ${floorName}`;
                    floorSection.appendChild(floorTitle);

                    const roomsOnFloor = rooms.filter(
                        (r) => (r.floorName || "G") === floorName,
                    );

                    roomsOnFloor.forEach((room) => {
                        const roomCard = document.createElement("div");
                        roomCard.className = "room-card";

                        const roomHeader = document.createElement("div");
                        roomHeader.className = "room-header";
                        roomHeader.innerHTML = `<h3>${room.name}</h3>`;
                        roomCard.appendChild(roomHeader);

                        const deviceList = document.createElement("div");
                        deviceList.className = "device-list";

                        if (room.devices && room.devices.length > 0) {
                            room.devices.forEach((device) =>
                                renderDeviceCard(device, deviceList, true),
                            );
                        } else {
                            deviceList.innerHTML = `<div class="empty-text">No devices</div>`;
                        }

                        roomCard.appendChild(deviceList);
                        floorSection.appendChild(roomCard);
                    });

                    container.appendChild(floorSection);
                });
            }

            function renderDeviceCard(device, containerElement, parentIsOn) {
                const isParentOn = parentIsOn !== undefined ? parentIsOn : true;
                const effectiveState = (isParentOn && device.state === "ON") ? "ON" : "OFF";
                const stateInfo = getStateInfo(effectiveState);

                const card = document.createElement("div");
                card.className = "device-card";
                card.id = `device-${device.deviceID}`;

                let extraDetails = "";
                if (device.type === "SafetyCritical" && device.maxOnDuration) {
                    extraDetails = `<span class="extra-info">${device.maxOnDuration}s max</span>`;
                } else if (device.type === "MultiUnit" && device.size) {
                    extraDetails = `<span class="extra-info">${device.size} units</span>`;
                }

                card.innerHTML = `
                    <div class="device-info">
                        <div class="device-header">
                            <span class="device-name">${device.name || "Unnamed Device"}</span>
                        </div>
                        <div class="device-meta">
                            <span class="device-type">${device.type || "SingleUnit"}</span>
                            ${extraDetails}
                        </div>
                    </div>
                    <div class="status-pill ${stateInfo.class}" id="status-pill-${device.deviceID}">
                        <span class="dot"></span>
                        <span class="status-text">${stateInfo.name}</span>
                    </div>
                    <div class="sub-units" id="subunits-${device.deviceID}"></div>
                `;

                containerElement.appendChild(card);

                if (device.subUnits && device.subUnits.length > 0) {
                    const currentIsOn = isParentOn && (device.state === "ON");
                    const subContainer = card.querySelector(
                        `#subunits-${device.deviceID}`,
                    );
                    device.subUnits.forEach((sub) =>
                        renderDeviceCard(sub, subContainer, currentIsOn),
                    );
                }
            }
        </script>
    </body>
</html>
