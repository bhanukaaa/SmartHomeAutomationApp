<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Devices</h1>
      <div class="badge-count"><span id="device-count">0</span> Active</div>
    </header>

    <div class="device-list" id="deviceList"></div>
  </div>

  <script>
    const socket = io();

    const DeviceState = {
      "ON": { name: "ON", class: "status-on" },
      "OFF": { name: "OFF", class: "status-off" },
      "ERROR": { name: "ERROR", class: "status-error" },
      "DISCONNECTED": { name: "DISCONNECTED", class: "status-disconnected" }
    };

    let devices = [];

    socket.on('initial_devices', function(initialDevices) {
      document.getElementById("deviceList").innerHTML = "";
      devices = initialDevices;
      devices.forEach(device => renderDeviceCard(device, document.getElementById("deviceList")));
      updateDeviceCount();
    });

    socket.on('device_added', function(device) {
      if (!findDeviceRecursive(devices, device.deviceID)) {
        devices.push(device);
        console.log(device)
        renderDeviceCard(device, document.getElementById("deviceList"));
        updateDeviceCount();
      }
    });

    socket.on('device_updated', function(device) {
      const targetDevice = findDeviceRecursive(devices, device.deviceID);
      if (targetDevice) {
        targetDevice.state = device.state;
        updateDeviceCardUI(device);
      }
    });

    function findDeviceRecursive(deviceList, deviceID) {
      for (let d of deviceList) {
        if (d.deviceID === deviceID) return d;
        if (d.subUnits) {
          let found = findDeviceRecursive(d.subUnits, deviceID);
          if (found) return found;
        }
      }
      return null;
    }

    function getStateInfo(state) {
      if (typeof state === 'number') {
        const numMap = { 1: "ON", 2: "OFF", 3: "ERROR", 4: "DISCONNECTED" };
        state = numMap[state] || "OFF";
      }
      return DeviceState[state] || DeviceState["OFF"];
    }

   // Function to render a device card, modified to handle subunits
function renderDeviceCard(device, containerElement) {
    const stateInfo = getStateInfo(device.state);

    console.log(device)

    const card = document.createElement("div");
    card.className = "device-card";
    card.id = `device-${device.deviceID}`;

    let extraDetails = "";
    if (device.type === "SafetyCritical") {
        extraDetails = `<span class="extra-info">Max Duration: ${device.maxOnDuration || 0}s</span>`;
    } else if (device.type === "MultiUnit") {
        extraDetails = `<span class="extra-info">Size: ${device.size || 0}</span>`;
    }

    card.innerHTML = `
        <div class="device-info">
            <div class="device-header">
                <span class="device-name">${device.name || "Unnamed Device"}</span>
                <span class="device-id">#${device.deviceID}</span>
            </div>
            <div class="device-meta">
                <span class="device-type">${device.type || "Generic"}</span>
                ${extraDetails}
            </div>
        </div>
        <div class="status-pill ${stateInfo.class}" id="status-pill-${device.deviceID}">
            <span class="dot"></span>
            <span class="status-text">${stateInfo.name}</span>
        </div>
        <div class="sub-units" id="subunits-${device.deviceID}"></div> <!-- Container for subunits -->
    `;

    containerElement.appendChild(card);

    // Recursively render subunits if they exist
    if (device.subUnits && device.subUnits.length > 0) {
        const subContainer = card.querySelector(`#subunits-${device.deviceID}`);
        device.subUnits.forEach(sub => renderDeviceCard(sub, subContainer));
    }
}

    function updateDeviceCardUI(device) {
      const stateInfo = getStateInfo(device.state);
      const pillElement = document.getElementById(`status-pill-${device.deviceID}`);
      if (pillElement) {
        pillElement.className = `status-pill ${stateInfo.class}`;
        const statusText = pillElement.querySelector('.status-text');
        if (statusText) statusText.innerText = stateInfo.name;
      }
    }

    function updateDeviceCount() {
      document.getElementById("device-count").innerText = devices.length;
    }
  </script>
</body>
</html>
